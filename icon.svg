<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- mottled ink fill, same treatment as the pills inside the app -->
    <filter id="pillInk" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="spec">
        <feFuncA type="linear" slope="0.45" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="inked"/>
      <feBlend in="SourceGraphic" in2="inked" mode="multiply"/>
    </filter>
    <!-- hand-drawn wobble on the pen strokes -->
    <filter id="penEdge" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect width="512" height="512" fill="#FAECE9"/>
